[workspace]
members = ["crates/soloe-terminal", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mheraskin/soloe"

[workspace.dependencies]
base64 = "0.22.1"
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
