[workspace]
members = ["crates/soloe-terminal", "apps/tray/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mheraskin/soloe"

[workspace.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.22.1"
image = { version = "0.25.8", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
