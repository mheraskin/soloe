name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Typecheck renderer and Electron shell
        run: pnpm typecheck

      - name: Typecheck workspace services
        run: pnpm --filter @soloe/protocol --filter @soloe/domain --filter @soloe/runtime --filter @soloe/server typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web client
        run: pnpm --filter @soloe/web build

      - name: Build remote Electron client
        run: pnpm --filter @soloe/desktop-electron build

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Windows build
        run: pnpm package:windows

  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Linux builds
        run: pnpm package:linux

  macos-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            command: pnpm package:macos:x64
          - runner: macos-latest
            arch: arm64
            command: pnpm package:macos:arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck macOS application
        run: pnpm typecheck

      - name: Test macOS application
        run: pnpm test

      - name: Test macOS tray ownership
        run: cargo test --manifest-path apps/tray/src-tauri/Cargo.toml

      - name: Package native macOS build
        run: ${{ matrix.command }}

      - name: Upload macOS package smoke artifacts
        uses: actions/upload-artifact@v5
        with:
          name: soloe-macos-${{ matrix.arch }}-${{ github.sha }}
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
