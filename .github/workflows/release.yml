name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: pnpm package:windows
            files: |
              release/*.exe
          - os: ubuntu-latest
            platform: linux
            command: pnpm package:linux
            files: |
              release/*.AppImage
              release/*.deb
          - os: macos-15-intel
            platform: macos-x64
            command: pnpm package:macos:x64
            files: target/release/bundle/dmg/*.dmg
          - os: macos-latest
            platform: macos-arm64
            command: pnpm package:macos:arm64
            files: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package unsigned platform build
        if: ${{ !startsWith(matrix.platform, 'macos-') }}
        run: ${{ matrix.command }}

      - name: Verify macOS signing and notarization credentials
        if: ${{ startsWith(matrix.platform, 'macos-') }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: test -n "$MACOS_CERTIFICATE" -a -n "$MACOS_CERTIFICATE_PASSWORD" -a -n "$APPLE_ID" -a -n "$APPLE_APP_SPECIFIC_PASSWORD" -a -n "$APPLE_TEAM_ID"

      - name: Import Apple Developer certificate
        if: ${{ startsWith(matrix.platform, 'macos-') }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          certificate_path="$RUNNER_TEMP/soloe-certificate.p12"
          keychain_path="$RUNNER_TEMP/soloe-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          test -n "$signing_identity"
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "SOLOE_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Package, sign, and notarize macOS build
        if: ${{ startsWith(matrix.platform, 'macos-') }}
        env:
          CSC_NAME: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.command }}

      - name: Remove signing keychain
        if: ${{ always() && startsWith(matrix.platform, 'macos-') }}
        run: security delete-keychain "$SOLOE_SIGNING_KEYCHAIN" || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: soloe-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: soloe-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          prerelease: true
          generate_release_notes: true
