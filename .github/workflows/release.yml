name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: pnpm package:windows
            files: |
              release/*.exe
          - os: ubuntu-latest
            platform: linux
            command: pnpm package:linux
            files: |
              release/*.AppImage
              release/*.deb
          - os: macos-15-intel
            platform: macos-x64
            command: pnpm package:macos:x64
            files: target/release/bundle/dmg/*.dmg
          - os: macos-latest
            platform: macos-arm64
            command: pnpm package:macos:arm64
            files: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package platform build
        run: ${{ matrix.command }}

      - name: Smoke test Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/smoke-windows-installer.ps1

      - name: Smoke test Linux packages
        if: matrix.platform == 'linux'
        run: bash scripts/smoke-linux-packages.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: soloe-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: soloe-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          prerelease: true
          generate_release_notes: true
