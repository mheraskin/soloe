appId: com.soloe.app
productName: Soloe
icon: build/icon.png
directories:
  output: release
  buildResources: build
beforeBuild: scripts/electron-builder-before-build.cjs
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - out/web/**/*
  - build/favicon.svg
  - build/icon.ico
  - build/icon.png
  - build/icon.svg
  - build/THIRD_PARTY_LICENSES.md
  - package.json
extraResources:
  - from: build/device-dns
    to: bin
  - from: build/icon.ico
    to: build/icon.ico
  - from: build/icon.png
    to: build/icon.png
  # electron-vite bundles everything except these runtime dependencies.
  # Placing them beside app.asar makes them available through Node's normal
  # parent node_modules lookup and keeps node-pty's native binary unpacked.
  - from: node_modules/node-pty
    to: node_modules/node-pty
  - from: node_modules/smol-toml
    to: node_modules/smol-toml
  - from: node_modules/ws
    to: node_modules/ws
win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon-macos.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  target:
    - target: dmg
    - target: zip
linux:
  icon: build/icon.png
  category: Development
  executableName: soloe
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  maintainer: Mykhail Heraskin
  packageCategory: devel
