appId: com.soloe.agent-terminal-cockpit
productName: Agent Terminal Cockpit
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/node-pty/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDir: true
linux:
  target:
    - AppImage
mac:
  target:
    - dmg
