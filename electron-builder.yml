appId: com.soloe.app
productName: Soloe
icon: build/icon.png
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - build/icon.png
  - build/icon.svg
  - package.json
asarUnpack:
  - node_modules/node-pty/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
mac:
  target:
    - dmg
